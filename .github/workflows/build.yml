name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate debug.keystore automatically
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp debug.keystore app/debug.keystore

    - name: Create google-services.json automatically
      run: |
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "113923036774",
            "firebase_url": "https://gen-lang-client-0353534085-default-rtdb.firebaseio.com",
            "project_id": "gen-lang-client-0353534085",
            "storage_bucket": "gen-lang-client-0353534085.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:113923036774:android:6414e354bb23b04da4bfa7",
                "android_client_info": {
                  "package_name": "com.aistudio.pulsedial.kxvqmn"
                }
              },
              "oauth_client": [
                {
                  "client_id": "113923036774-h1dqvsll52j968f5op516cndp12l68sc.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.aistudio.pulsedial.kxvqmn",
                    "certificate_hash": "8a748518ea4c9f7b98d171608ca8ee27284a36fb"
                  }
                },
                {
                  "client_id": "113923036774-p49ovlo674f2vt7fk3u0i2hn9h64q9ua.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyBzeB0Jkit3HOLii6r023vOaZzdHbX0Zrk"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "113923036774-p49ovlo674f2vt7fk3u0i2hn9h64q9ua.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
